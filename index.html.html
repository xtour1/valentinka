<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 Валентинка для Сережи</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Dancing+Script:wght@700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd1dc 100%);
            text-align: center;
            padding: 60px 20px;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        h1 {
            color: #ff4081;
            font-size: 3.5rem;
            margin-bottom: 60px;
            font-family: 'Dancing Script', cursive;
            text-shadow: 3px 3px 6px rgba(255, 64, 129, 0.15);
            line-height: 1.3;
        }
        
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .valentine-btn {
            padding: 20px 45px;
            font-size: 1.8rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            position: relative;
            z-index: 10;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            min-width: 180px;
        }
        
        #btn-yes {
            background: linear-gradient(145deg, #ff4081, #ff79b0);
            color: white;
            border: 3px solid #ff4081;
        }
        
        #btn-no {
            background: white;
            color: #555;
            border: 3px solid #ffb6c1;
        }
        
        .valentine-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }
        
        #btn-yes:hover {
            background: linear-gradient(145deg, #ff79b0, #ff4081);
        }
        
        #btn-no:hover {
            background: #fff0f5;
        }
        
        #celebration {
            display: none;
            margin-top: 40px;
            animation: fadeInUp 0.8s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #celebration h2 {
            color: #ff4081;
            font-size: 4.5rem;
            margin: 30px 0;
            font-family: 'Dancing Script', cursive;
        }
        
        .love-message {
            font-size: 1.5rem;
            color: #ff6699;
            margin: 20px 0;
            line-height: 1.6;
        }
        
        #gif-container {
            margin: 30px auto;
            width: 300px;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        #gif-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Фон с сердечками */
        .hearts-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
        }
        
        .heart-bg {
            position: absolute;
            font-size: 40px;
            opacity: 0.3;
            animation: floatBg 20s linear infinite;
        }
        
        @keyframes floatBg {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }
        
        /* Летающие сердечки при кликах */
        .flying-heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            animation: fly 1s ease-out forwards;
        }
        
        @keyframes fly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.5);
            }
        }
        
        /* Анимация увеличения */
        @keyframes grow {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .growing {
            animation: grow 0.5s ease;
        }
        
        /* Для маленьких экранов */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
                margin-bottom: 40px;
            }
            
            .valentine-btn {
                padding: 18px 35px;
                font-size: 1.5rem;
                min-width: 160px;
            }
            
            .buttons-wrapper {
                gap: 20px;
            }
            
            #celebration h2 {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Фоновые сердечки -->
    <div class="hearts-bg" id="hearts-bg"></div>
    
    <div class="container">
        <h1>Сережа, ты будешь моим Валентином? 💕</h1>
        
        <div class="buttons-wrapper">
            <button class="valentine-btn" id="btn-yes">ДА! 💖</button>
            <button class="valentine-btn" id="btn-no">нет</button>
        </div>
        
        <div id="celebration">
            <h2>УРАААА! 🎉</h2>
            <div id="gif-container">
                <!-- ВСТАВЬ СВОЮ GIF ССЫЛКУ ЗДЕСЬ -->
                <img id="gif-img" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWl2NXptcjhkcnA5MGJ2dm55dXF6bTlicnpnNDBjbjEzdjJjYndlZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/sMe2be8ffM6M7st5ZL/giphy.gif" alt="Праздник любви">
            </div>
        </div>
    </div>

    <script>
        // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
        
        // Создаем летающее сердечко
        function createFlyingHeart(x, y, color) {
            const heart = document.createElement('div');
            heart.className = 'flying-heart';
            heart.innerHTML = '💖';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.color = color;
            heart.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
            heart.style.setProperty('--ty', (Math.random() * -200 - 50) + 'px');
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 1000);
        }
        
        // Создаем фоновые сердечки
        function createBackgroundHearts() {
            const container = document.getElementById('hearts-bg');
            const hearts = ['💖', '💕', '💘', '💝', '❤️'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 20 + 's';
                heart.style.fontSize = (30 + Math.random() * 30) + 'px';
                heart.style.opacity = 0.1 + Math.random() * 0.3;
                container.appendChild(heart);
            }
        }
        
        // Плавное увеличение элемента
        function smoothScale(element, scale) {
            element.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
            element.style.transform = `scale(${scale})`;
        }
        
        // Перемещает кнопку в случайное место
        function moveButtonRandomly(button) {
            const maxX = window.innerWidth - button.offsetWidth - 100;
            const maxY = window.innerHeight - button.offsetHeight - 100;
            const x = Math.max(50, Math.random() * maxX);
            const y = Math.max(100, Math.random() * maxY);
            
            button.style.position = 'fixed';
            button.style.left = x + 'px';
            button.style.top = y + 'px';
            button.style.transition = 'all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
            
            // Создаем сердечко на старом месте
            const rect = button.getBoundingClientRect();
            createFlyingHeart(rect.left + rect.width/2, rect.top + rect.height/2, '#ff4081');
        }
        
        // === ОСНОВНАЯ ЛОГИКА ===
        
        // Находим элементы
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const celebration = document.getElementById('celebration');
        
        // Настройки
        const noPhrases = [
            "нет",
            "ну пожалуйста",
            "ну почему?",
            "ты афигел??",
            "точно нет?",
            "мдааа серый",
            "ну хватит"
        ];
        
        let currentPhrase = 0;
        let yesScale = 1;
        let escapeAttempts = 0;
        const maxEscapes = 3;
        
        // Инициализация
        window.addEventListener('DOMContentLoaded', () => {
            createBackgroundHearts();
            console.log('Страничка загружена! Кнопки должны работать.');
        });
        
        // === ОБРАБОТЧИК КНОПКИ "НЕТ" ===
        
        // Когда наводим на "нет"
        btnNo.addEventListener('mouseenter', function(e) {
            if (escapeAttempts < maxEscapes) {
                escapeAttempts++;
                moveButtonRandomly(this);
                
                // Меняем текст после перемещения
                setTimeout(() => {
                    if (currentPhrase < noPhrases.length - 1) {
                        currentPhrase++;
                        this.textContent = noPhrases[currentPhrase];
                    }
                }, 300);
                
                // Увеличиваем кнопку ДА
                yesScale += 0.12;
                smoothScale(btnYes, yesScale);
                btnYes.classList.add('growing');
                setTimeout(() => btnYes.classList.remove('growing'), 500);
                
                // Создаем сердечки
                createFlyingHeart(e.clientX, e.clientY, '#ff79b0');
            }
        });
        
        // Когда кликаем на "нет" (если удалось поймать)
        btnNo.addEventListener('click', function() {
            if (escapeAttempts >= maxEscapes) {
                currentPhrase = Math.min(currentPhrase + 1, noPhrases.length - 1);
                this.textContent = noPhrases[currentPhrase];
                
                // Больше увеличиваем кнопку ДА
                yesScale += 0.2;
                smoothScale(btnYes, yesScale);
                
                // Если последняя фраза - скрываем кнопку "нет"
                if (currentPhrase === noPhrases.length - 1) {
                    setTimeout(() => {
                        this.style.opacity = '0';
                        this.style.transform = 'scale(0.5)';
                        this.style.pointerEvents = 'none';
                        
                        // Делаем кнопку ДА особенной
                        btnYes.style.background = 'linear-gradient(145deg, #ff0066, #ff4081)';
                        btnYes.style.boxShadow = '0 15px 35px rgba(255, 64, 129, 0.4)';
                        btnYes.textContent = 'НАЖМИ НА МЕНЯ! 💘';
                    }, 300);
                }
            }
        });
        
        // === ОБРАБОТЧИК КНОПКИ "ДА" ===
        
        btnYes.addEventListener('click', function() {
            // Анимация исчезновения
            document.querySelector('h1').style.opacity = '0';
            document.querySelector('h1').style.transition = 'opacity 0.5s ease';
            
            document.querySelector('.buttons-wrapper').style.opacity = '0';
            document.querySelector('.buttons-wrapper').style.transition = 'opacity 0.5s ease';
            
            // Ждем и показываем праздник
            setTimeout(() => {
                document.querySelector('h1').style.display = 'none';
                document.querySelector('.buttons-wrapper').style.display = 'none';
                
                // Показываем праздничный экран
                celebration.style.display = 'block';
                
                // Создаем много сердечек
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        createFlyingHeart(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight,
                            ['#ff4081', '#ff79b0', '#ff0066'][Math.floor(Math.random() * 3)]
                        );
                    }, i * 100);
                }
                
                // Меняем фон на праздничный
                document.body.style.background = 'linear-gradient(135deg, #ffccd5 0%, #ff8fab 100%)';

 // Добавляем поздравление
                setTimeout(() => {
                    alert('\nТы самый лучший');
                }, 800);
            }, 500);
        });
        
        // Проверяем, что скрипт загружен
        console.log('Скрипт загружен. Кнопки готовы к работе!');
    </script>
</body>
</html>
